<rect x="475.5" y="218.0" width="49" height="24" fill="white"/>
<text x="500.0" y="236.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Revisar</text>
<path d="M500.0,385 L500.0,465" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M500.0,465 L504.0,455.0 L496.0,455.0 Z" fill="#375d7b"/>
<rect x="475.5" y="398.0" width="49" height="24" fill="white"/>
<text x="500.0" y="416.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Revisar</text>
<path d="M500.0,565 L500.0,645" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M500.0,645 L504.0,635.0 L496.0,635.0 Z" fill="#375d7b"/>
<rect x="475.5" y="578.0" width="49" height="24" fill="white"/>
<text x="500.0" y="596.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Revisar</text>
<path d="M500.0,745 L500.0,825" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M500.0,825 L504.0,815.0 L496.0,815.0 Z" fill="#375d7b"/>
<rect x="472.0" y="758.0" width="56" height="24" fill="white"/>
<text x="500.0" y="776.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Integrar</text>
<rect x="280" y="105" width="440" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,148 H720" stroke="#b9ccd9"/>
<text x="295" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">1  Cuenta y acceso</text>
<text x="295" y="175" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Registro, sesión y protección de credenciales.</text>
<rect x="280" y="285" width="440" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,328 H720" stroke="#b9ccd9"/>
<text x="295" y="314" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">2  Conversaciones</text>
<text x="295" y="355" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Parejas únicas, grupos y roles.</text>
<rect x="280" y="465" width="440" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,508 H720" stroke="#b9ccd9"/>
<text x="295" y="494" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">3  Intercambio e historial</text>
<text x="295" y="535" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Mensajes, adjuntos, sincronización y lectura.</text>
<rect x="280" y="645" width="440" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,688 H720" stroke="#b9ccd9"/>
<text x="295" y="674" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">4  Gestión personal</text>
<text x="295" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Perfil, preferencias y recuperación.</text>
<rect x="280" y="825" width="440" height="125" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,868 H720" stroke="#b9ccd9"/>
<text x="295" y="854" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">5  Aceptación entre estudiantes</text>
<text x="295" y="895" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Dos navegadores y dispositivos distintos.</text>
<text x="295" y="920" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Permisos, continuidad y capacidad.</text>
<text x="30" y="1002" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">El diagrama organiza la evaluación. No representa resultados de pruebas ya ejecutadas.</text>
</svg>
