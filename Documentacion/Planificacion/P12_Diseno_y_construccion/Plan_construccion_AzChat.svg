<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
<title id="title">Construcción y evaluación por incrementos</title><desc id="desc">Cada entrega debe demostrar que los estudiantes pueden comunicarse con acceso autorizado.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#375d7b" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="1040" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#243b50" text-anchor="start">Construcción y evaluación por incrementos</text>
<text x="30" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Cada entrega debe demostrar que los estudiantes pueden comunicarse con acceso autorizado.</text>
<path d="M500.0,205 L500.0,285" stroke="#375d7b" stroke-width="2" fill="none"/>
