<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img"><title>Desarrollo incremental e iterativo de AzChat</title><desc>Boceto esquemático con datos ficticios. No es una captura de la aplicación.</desc><rect width="100%" height="100%" fill="white"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="25" fill="#243244" font-weight="bold">Desarrollo incremental e iterativo de AzChat</text><text x="28" y="64" font-family="Arial,sans-serif" font-size="16" fill="#5d6976" font-weight="normal">AzChat · Diseño revisado · Elementos simplificados y datos ficticios</text><rect x="28" y="140" width="265" height="143" rx="3" fill="#f5f7fa" stroke="#677586" stroke-width="1.6"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="22" fill="#243244" font-weight="bold">Necesidad</text><text x="46" y="230" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Observar y priorizar</text><path d="M293 210 L318 210" stroke="#677586" fill="none" stroke-width="1.6"/><polyline points="308.0950818741206,214.78462087522354 318,210 308.0950818741206,205.21537912477646" fill="none" stroke="#677586" stroke-width="1.6"/><rect x="321" y="140" width="265" height="143" rx="3" fill="#f5f7fa" stroke="#677586" stroke-width="1.6"/><text x="339" y="185" font-family="Arial,sans-serif" font-size="22" fill="#243244" font-weight="bold">Planificación</text><text x="339" y="230" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Analizar el cambio</text><path d="M586 210 L611 210" stroke="#677586" fill="none" stroke-width="1.6"/><polyline points="601.0950818741205,214.78462087522354 611,210 601.0950818741205,205.21537912477646" fill="none" stroke="#677586" stroke-width="1.6"/><rect x="614" y="140" width="265" height="143" rx="3" fill="#f5f7fa" stroke="#677586" stroke-width="1.6"/><text x="632" y="185" font-family="Arial,sans-serif" font-size="22" fill="#243244" font-weight="bold">Construcción</text><text x="632" y="230" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Integrar la mejora</text><path d="M879 210 L904 210" stroke="#677586" fill="none" stroke-width="1.6"/><polyline points="894.0950818741205,214.78462087522354 904,210 894.0950818741205,205.21537912477646" fill="none" stroke="#677586" stroke-width="1.6"/><rect x="907" y="140" width="265" height="143" rx="3" fill="#f5f7fa" stroke="#677586" stroke-width="1.6"/><text x="925" y="185" font-family="Arial,sans-serif" font-size="22" fill="#243244" font-weight="bold">Validación</text><text x="925" y="230" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Probar y corregir</text><path d="M1039 283 L1039 334" stroke="#677586" fill="none" stroke-width="1.6"/><path d="M1039 334 L454 334" stroke="#677586" fill="none" stroke-width="1.6"/><path d="M454 334 L454 283" stroke="#677586" fill="none" stroke-width="1.6"/><polyline points="458.78462087522354,292.9049181258794 454,283 449.21537912477646,292.9049181258794" fill="none" stroke="#677586" stroke-width="1.6"/><text x="545" y="363" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Si hay ajustes, se revisa el incremento</text><text x="28" y="416" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Resultado: una versión funcional ampliada y una nueva necesidad que inicia el siguiente ciclo.</text></svg>