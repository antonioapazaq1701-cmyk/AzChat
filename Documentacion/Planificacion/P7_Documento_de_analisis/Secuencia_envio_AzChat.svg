<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="t d"><title id="t">Secuencia de un mensaje entre estudiantes</title><desc id="d">Guardar antes de confirmar y recuperar por consultas HTTP periódicas.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#375d7b"/></marker></defs><rect width="1000" height="940" fill="white"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#243b50">Secuencia de un mensaje entre estudiantes</text>
<text x="30" y="66" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#243b50">El receptor consulta las novedades; no hay un canal Socket.IO.</text>
<rect x="26" y="100" width="208" height="45" fill="#eaf2f8" stroke="#6a8ba6"/><line x1="130" y1="145" x2="130" y2="864" stroke="#92a9b9" stroke-dasharray="7 5"/>
<text x="38" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#243b50">Estudiante A</text>
<rect x="276" y="100" width="208" height="45" fill="#eaf2f8" stroke="#6a8ba6"/><line x1="380" y1="145" x2="380" y2="864" stroke="#92a9b9" stroke-dasharray="7 5"/>
<text x="288" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#243b50">Servidor Express</text>
<rect x="526" y="100" width="208" height="45" fill="#eaf2f8" stroke="#6a8ba6"/><line x1="630" y1="145" x2="630" y2="864" stroke="#92a9b9" stroke-dasharray="7 5"/>
<text x="538" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#243b50">PostgreSQL</text>
<rect x="766" y="100" width="208" height="45" fill="#eaf2f8" stroke="#6a8ba6"/><line x1="870" y1="145" x2="870" y2="864" stroke="#92a9b9" stroke-dasharray="7 5"/>
<text x="778" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#243b50">Estudiante B</text>
<line x1="130" y1="210" x2="380" y2="210" stroke="#375d7b" stroke-width="2"/>
<text x="139" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">1  POST mensaje con idEnvio</text>
<path d="M380,210 L370,206 L370,214 Z" fill="#375d7b"/>
<line x1="380" y1="285" x2="630" y2="285" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="273" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">2  BEGIN y bloqueo del chat</text>
<path d="M630,285 L620,281 L620,289 Z" fill="#375d7b"/>
<line x1="380" y1="360" x2="630" y2="360" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="348" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">3  Pertenencia e intento previo</text>
<path d="M630,360 L620,356 L620,364 Z" fill="#375d7b"/>
<line x1="380" y1="435" x2="630" y2="435" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="423" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">4  Mensaje + adjuntos y COMMIT</text>
<path d="M630,435 L620,431 L620,439 Z" fill="#375d7b"/>
<line x1="380" y1="510" x2="130" y2="510" stroke="#375d7b" stroke-width="2"/>
<text x="139" y="498" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">5  201 nuevo / 200 reintento</text>
<path d="M130,510 L140,506 L140,514 Z" fill="#375d7b"/>
<line x1="870" y1="600" x2="380" y2="600" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="588" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">6  GET novedades con cursor</text>
<path d="M380,600 L390,596 L390,604 Z" fill="#375d7b"/>
<line x1="380" y1="675" x2="630" y2="675" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="663" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">7  Consultar mensajes y cambios</text>
<path d="M630,675 L620,671 L620,679 Z" fill="#375d7b"/>
<line x1="380" y1="750" x2="870" y2="750" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="738" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">8  Devolver datos al receptor</text>
<path d="M870,750 L860,746 L860,754 Z" fill="#375d7b"/>
<line x1="870" y1="825" x2="380" y2="825" stroke="#375d7b" stroke-width="2"/>
<text x="389" y="813" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">9  Lectura al ver el final del chat</text>
<path d="M380,825 L390,821 L390,829 Z" fill="#375d7b"/>
<text x="30" y="909" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#243b50">Después del guardado puede prepararse un aviso push independiente de la consulta y de la lectura.</text>
</svg>
