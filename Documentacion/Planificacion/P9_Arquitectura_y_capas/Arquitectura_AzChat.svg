<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura del chat universitario</title><desc id="desc">El servidor media entre los estudiantes, sus datos y los servicios de apoyo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#375d7b" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="870" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#243b50" text-anchor="start">Arquitectura del chat universitario</text>
<text x="30" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">El servidor media entre los estudiantes, sus datos y los servicios de apoyo.</text>
<path d="M445,185.0 L555,197.5" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M555,197.5 L545.51558620428,192.39648210039826 L544.6123086999257,200.34532413871602 Z" fill="#375d7b"/>
<rect x="482.5" y="164.25" width="35" height="24" fill="white"/>
<text x="500.0" y="182.25" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">HTTPS</text>
<path d="M760.0,280 L760.0,410" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M760.0,410 L764.0,400.0 L756.0,400.0 Z" fill="#375d7b"/>
<rect x="714.5" y="318.0" width="91" height="24" fill="white"/>
<text x="760.0" y="336.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">SQL sobre TLS</text>
<path d="M555,197.5 L445,485.0" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M445,485.0 L452.30934709646385,477.0896621422713 L444.837570064523,474.2308952778766 Z" fill="#375d7b"/>
<rect x="482.5" y="314.25" width="35" height="24" fill="white"/>
<text x="500.0" y="332.25" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">HTTPS</text>
<rect x="35" y="115" width="410" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,158 H445" stroke="#b9ccd9"/>
<text x="50" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Navegadores de estudiantes</text>
<text x="50" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">HTML, CSS y JavaScript.</text>
<text x="50" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Formularios, historial y adjuntos.</text>
<text x="50" y="235" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Página y API del mismo origen.</text>
<rect x="555" y="115" width="410" height="165" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,158 H965" stroke="#b9ccd9"/>
<text x="570" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Servidor en Render</text>
<text x="570" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Node.js + Express.</text>
<text x="570" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Sesión y autorización por operación.</text>
<text x="570" y="235" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">HTTP periódico para sincronizar.</text>
<text x="570" y="260" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Rutas de mensajes y archivos.</text>
<rect x="555" y="410" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,453 H965" stroke="#b9ccd9"/>
<text x="570" y="439" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">PostgreSQL en Supabase</text>
<text x="570" y="480" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Esquema privado azchat_complete.</text>
<text x="570" y="505" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Cuentas, chats, mensajes y binarios.</text>
<text x="570" y="530" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Sesiones y recuperación.</text>
<rect x="35" y="410" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,453 H445" stroke="#b9ccd9"/>
<text x="50" y="439" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Correo y servicio Web Push</text>
<text x="50" y="480" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Código o solicitud de autorización.</text>
<text x="50" y="505" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Aviso de un mensaje ya guardado.</text>
<text x="50" y="530" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">La lectura sigue siendo otro paso.</text>
<rect x="35" y="690" width="930" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,733 H965" stroke="#b9ccd9"/>
<text x="50" y="719" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Portal de planificación · GitHub Pages</text>
<text x="50" y="760" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Documentación HTML, PDF y bocetos. El botón Abrir chat lleva a la aplicación.</text>
<text x="30" y="832" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">El navegador no se conecta directamente a PostgreSQL. El portal estático no ejecuta el chat.</text>
</svg>
