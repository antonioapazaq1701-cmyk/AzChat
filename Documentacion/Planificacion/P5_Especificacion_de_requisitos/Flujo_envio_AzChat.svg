<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Reglas de un envío</title><desc id="desc">La validación protege el intercambio entre estudiantes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#375d7b" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="590" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#243b50" text-anchor="start">Reglas de un envío</text>
<text x="30" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">La validación protege el intercambio entre estudiantes.</text>
<path d="M455,172.5 L545,172.5" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M545,172.5 L535.0,168.5 L535.0,176.5 Z" fill="#375d7b"/>
<rect x="479.0" y="145.5" width="42" height="24" fill="white"/>
<text x="500.0" y="163.5" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Enviar</text>
<path d="M745.0,235 L745.0,330" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M745.0,330 L749.0,320.0 L741.0,320.0 Z" fill="#375d7b"/>
<rect x="710.0" y="255.5" width="70" height="24" fill="white"/>
<text x="745.0" y="273.5" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Autorizado</text>
<path d="M545,405.0 L455,405.0" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M455,405.0 L465.0,409.0 L465.0,401.0 Z" fill="#375d7b"/>
<rect x="468.5" y="378.0" width="63" height="24" fill="white"/>
<text x="500.0" y="396.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Resultado</text>
<rect x="55" y="110" width="400" height="125" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M55,153 H455" stroke="#b9ccd9"/>
<text x="70" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Preparar contenido</text>
<text x="70" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Texto o adjuntos y un idEnvio.</text>
<text x="70" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Aplicar los límites de P5.</text>
<rect x="545" y="110" width="400" height="125" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M545,153 H945" stroke="#b9ccd9"/>
<text x="560" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Comprobar autorización</text>
<text x="560" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Sesión vigente y pertenencia.</text>
<text x="560" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Identidad tomada de la sesión.</text>
<rect x="545" y="330" width="400" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M545,373 H945" stroke="#b9ccd9"/>
<text x="560" y="359" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Validar y guardar</text>
<text x="560" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Contenido, respuesta y archivos.</text>
<text x="560" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Reintento idéntico: devolver el mismo.</text>
<text x="560" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Carga distinta con igual ID: conflicto.</text>
<rect x="55" y="330" width="400" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M55,373 H455" stroke="#b9ccd9"/>
<text x="70" y="359" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Resolver el resultado</text>
<text x="70" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Guardado: confirmar en la interfaz.</text>
<text x="70" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Fallo de red: pendiente y Reintentar.</text>
<text x="70" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Error de datos: corregir contenido.</text>
<text x="30" y="552" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Un mensaje vacío sin archivos se rechaza. La confirmación de guardado no acredita lectura.</text>
</svg>
