<text x="55" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">ClienteChat · publico/</text>
<text x="55" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Pantallas, borradores y pendientes.</text>
<text x="55" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Peticiones HTTP y conciliación por ID.</text>
<text x="55" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Audio, imágenes y avisos.</text>
