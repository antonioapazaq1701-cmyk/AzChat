<text x="575" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">ServidorChat · servidor.js</text>
<text x="575" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Registro, acceso y sesión.</text>
<text x="575" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Montaje de rutas y errores.</text>
<text x="575" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Entrega de la interfaz.</text>
