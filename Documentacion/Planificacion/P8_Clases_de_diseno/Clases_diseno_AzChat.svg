<path d="M560,413 H960" stroke="#b9ccd9"/>
<text x="575" y="399" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Conversaciones y archivos</text>
<text x="575" y="440" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">conversaciones.js: chats y mensajes.</text>
<text x="575" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">perfil-archivos.js: perfil y binarios.</text>
<text x="575" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">exportar.js: historial TXT.</text>
<rect x="40" y="370" width="400" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M40,413 H440" stroke="#b9ccd9"/>
<text x="55" y="399" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Recuperación y avisos</text>
<text x="55" y="440" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">recuperacion.js + correo.js.</text>
<text x="55" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">novedades.js: presencia y push.</text>
<text x="55" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Servicios externos desde el servidor.</text>
<rect x="290" y="640" width="420" height="125" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M290,683 H710" stroke="#b9ccd9"/>
<text x="305" y="669" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">AccesoDatos · datos.js</text>
<text x="305" y="710" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Pool PostgreSQL privado.</text>
<text x="305" y="735" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">utilidades.js: transacción y permisos.</text>
<text x="30" y="812" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Son responsabilidades implementables con módulos y funciones; no exige herencia ni microservicios.</text>
