<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">Objetivos de los estudiantes en AzChat</title><desc id="desc">Vista de conjunto; los trece recorridos detallados se presentan por separado.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#375d7b" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="630" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#243b50" text-anchor="start">Objetivos de los estudiantes en AzChat</text>
<text x="30" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Vista de conjunto; los trece recorridos detallados se presentan por separado.</text>
<rect x="35" y="115" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,158 H445" stroke="#b9ccd9"/>
<text x="50" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Acceder a la comunicación</text>
<text x="50" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-01 Registrarse.</text>
<text x="50" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-02 Iniciar sesión.</text>
<text x="50" y="235" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-08 Cerrar sesión.</text>
<rect x="555" y="115" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,158 H965" stroke="#b9ccd9"/>
<text x="570" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Conversar con compañeros</text>
<text x="570" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-03 Iniciar chat privado.</text>
<text x="570" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-04 Consultar conversaciones.</text>
<text x="570" y="235" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-07 Consultar historial.</text>
<rect x="35" y="375" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,418 H445" stroke="#b9ccd9"/>
<text x="50" y="404" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Intercambiar y organizar</text>
<text x="50" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-05 Enviar y CU-06 recibir.</text>
<text x="50" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-11 Compartir una entrega.</text>
<text x="50" y="495" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-12 Administrar un grupo.</text>
<rect x="555" y="375" width="410" height="150" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,418 H965" stroke="#b9ccd9"/>
<text x="570" y="404" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Cuidar el acceso y personalizar</text>
<text x="570" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-09 Recuperar con correo vinculado.</text>
<text x="570" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-10 Recuperar con correo nuevo.</text>
<text x="570" y="495" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">CU-13 Elegir un nombre privado.</text>
<text x="30" y="592" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Perfil, edición de imágenes, voz, preferencias y exportación completan las tareas descritas en P10.</text>
</svg>
