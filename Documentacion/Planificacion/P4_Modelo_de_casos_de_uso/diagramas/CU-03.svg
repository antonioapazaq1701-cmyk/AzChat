<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 656" width="1000" height="656" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-03 · Iniciar chat privado</title><desc id="descripcion">Flujo por participantes. Persona registrada: Buscar a la otra persona. Sistema: Mostrar coincidencias autorizadas. Persona registrada: Seleccionar al destinatario. Sistema: Abrir el chat existente o crear uno por pareja. Alternativas: Si no hay coincidencias, permitir otra búsqueda. No crear una conversación consigo mismo.</desc><rect x="0" y="0" width="1000" height="656" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-03 · Iniciar chat privado</text><rect x="6.0" y="58" width="488.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="250.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona registrada</text><line x1="0.0" y1="115" x2="0.0" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="506.0" y="58" width="488.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="750.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="500.0" y1="115" x2="500.0" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="110.0" y="150" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="250.0" y="190.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Buscar a la otra persona</text><path d="M250.0 220 V233.0 H750.0 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M746.0 236 L750.0 243 L754.0 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="610.0" y="246" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="750.0" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Mostrar coincidencias</text><text x="750.0" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">autorizadas</text><path d="M750.0 316 V329.0 H250.0 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M246.0 332 L250.0 339 L254.0 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="110.0" y="342" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="250.0" y="382.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Seleccionar al destinatario</text><path d="M250.0 412 V425.0 H750.0 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M746.0 428 L750.0 435 L754.0 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="610.0" y="438" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="750.0" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Abrir el chat existente o</text><text x="750.0" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">crear uno por pareja</text><rect x="18" y="544" width="964" height="94" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="572" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="599" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Si no hay coincidencias, permitir otra búsqueda. No crear una conversación consigo mismo.</text></svg>