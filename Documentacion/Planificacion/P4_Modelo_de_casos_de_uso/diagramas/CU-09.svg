<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1062" width="1000" height="1062" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-09 · Recuperar contraseña con correo vinculado</title><desc id="descripcion">Flujo por participantes. Persona solicitante: Indicar la cuenta y su correo ya verificado. Persona solicitante: Revisar los datos y confirmar la solicitud. Sistema: Solicitar la entrega de un código. Servicio de correo: Entregar el código al correo vinculado. Persona solicitante: Introducir el código recibido. Sistema: Validar el código y habilitar el cambio. Persona solicitante: Escribir y confirmar la nueva contraseña. Sistema: Guardar el cambio e invalidar sesiones anteriores. Alternativas: Un código incorrecto, vencido o consumido no habilitará el cambio. No se requerirá autorización administrativa para el correo ya vinculado.</desc><rect x="0" y="0" width="1000" height="1062" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-09 · Recuperar contraseña con correo vinculado</text><rect x="6.0" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="166.66666666666666" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona solicitante</text><line x1="0.0" y1="115" x2="0.0" y2="918" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="339.3333333333333" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="500.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="333.3333333333333" y1="115" x2="333.3333333333333" y2="918" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="672.6666666666666" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="833.3333333333333" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Servicio de correo</text><line x1="666.6666666666666" y1="115" x2="666.6666666666666" y2="918" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="26.666666666666657" y="150" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="180.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Indicar la cuenta y su</text><text x="166.66666666666666" y="200.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">correo ya verificado</text><path d="M166.66666666666666 220 V233.0 H166.66666666666666 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M162.66666666666666 236 L166.66666666666666 243 L170.66666666666666 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="26.666666666666657" y="246" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Revisar los datos y</text><text x="166.66666666666666" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">confirmar la solicitud</text><path d="M166.66666666666666 316 V329.0 H500.0 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 332 L500.0 339 L504.0 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="342" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="372.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Solicitar la entrega de un</text><text x="500.0" y="392.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">código</text><path d="M500.0 412 V425.0 H833.3333333333333 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M829.3333333333333 428 L833.3333333333333 435 L837.3333333333333 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="693.3333333333333" y="438" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="833.3333333333333" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Entregar el código al correo</text><text x="833.3333333333333" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">vinculado</text><path d="M833.3333333333333 508 V521.0 H166.66666666666666 V529" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M162.66666666666666 524 L166.66666666666666 531 L170.66666666666666 524" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="26.666666666666657" y="534" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="564.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">5. Introducir el código</text><text x="166.66666666666666" y="584.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">recibido</text><path d="M166.66666666666666 604 V617.0 H500.0 V625" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 620 L500.0 627 L504.0 620" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="630" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="660.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">6. Validar el código y</text><text x="500.0" y="680.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">habilitar el cambio</text><path d="M500.0 700 V713.0 H166.66666666666666 V721" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M162.66666666666666 716 L166.66666666666666 723 L170.66666666666666 716" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="26.666666666666657" y="726" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="756.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">7. Escribir y confirmar la</text><text x="166.66666666666666" y="776.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">nueva contraseña</text><path d="M166.66666666666666 796 V809.0 H500.0 V817" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 812 L500.0 819 L504.0 812" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="822" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="852.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">8. Guardar el cambio e</text><text x="500.0" y="872.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">invalidar sesiones anteriores</text><rect x="18" y="928" width="964" height="116" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="956" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="983" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Un código incorrecto, vencido o consumido no habilitará el cambio. No se requerirá autorización</text><text x="36" y="1005" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">administrativa para el correo ya vinculado.</text></svg>