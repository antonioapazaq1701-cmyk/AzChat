<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1254" width="1000" height="1254" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-10 · Recuperar contraseña sin correo vinculado</title><desc id="descripcion">Flujo por participantes. Persona solicitante: Proponer un correo y confirmar la solicitud. Sistema: Registrar la solicitud como pendiente. Servicio de correo: Entregar la solicitud al responsable. Responsable: Comprobar identidad y previsualizar los datos. Responsable: Revisar la aprobación y confirmarla de nuevo. Sistema: Autorizar la verificación del correo propuesto. Persona solicitante: Solicitar el código de verificación. Servicio de correo: Entregar el código al correo propuesto. Persona solicitante: Introducir el código y confirmar una nueva clave. Sistema: Validar, vincular el correo y guardar el cambio. Alternativas: Rechazar o dejar vencer la solicitud impedirá continuar. Sin código válido o sin acceso al correo no se completará el cambio. Aprobar no cambiará por sí solo la contraseña.</desc><rect x="0" y="0" width="1000" height="1254" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-10 · Recuperar contraseña sin correo vinculado</text><rect x="6.0" y="58" width="238.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="125.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona solicitante</text><line x1="0.0" y1="115" x2="0.0" y2="1110" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="256.0" y="58" width="238.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="375.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="250.0" y1="115" x2="250.0" y2="1110" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="506.0" y="58" width="238.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="625.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Responsable</text><line x1="500.0" y1="115" x2="500.0" y2="1110" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="756.0" y="58" width="238.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="875.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Servicio de correo</text><line x1="750.0" y1="115" x2="750.0" y2="1110" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="12.0" y="150" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="125.0" y="180.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Proponer un correo y</text><text x="125.0" y="200.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">confirmar la solicitud</text><path d="M125.0 220 V233.0 H375.0 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M371.0 236 L375.0 243 L379.0 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="262.0" y="246" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="375.0" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Registrar la solicitud</text><text x="375.0" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">como pendiente</text><path d="M375.0 316 V329.0 H875.0 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M871.0 332 L875.0 339 L879.0 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="762.0" y="342" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="875.0" y="372.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Entregar la solicitud</text><text x="875.0" y="392.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">al responsable</text><path d="M875.0 412 V425.0 H625.0 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M621.0 428 L625.0 435 L629.0 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="512.0" y="438" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="625.0" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Comprobar identidad y</text><text x="625.0" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">previsualizar los datos</text><path d="M625.0 508 V521.0 H625.0 V529" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M621.0 524 L625.0 531 L629.0 524" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="512.0" y="534" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="625.0" y="564.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">5. Revisar la aprobación</text><text x="625.0" y="584.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">y confirmarla de nuevo</text><path d="M625.0 604 V617.0 H375.0 V625" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M371.0 620 L375.0 627 L379.0 620" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="262.0" y="630" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="375.0" y="650.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">6. Autorizar la</text><text x="375.0" y="670.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">verificación del correo</text><text x="375.0" y="690.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">propuesto</text><path d="M375.0 700 V713.0 H125.0 V721" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M121.0 716 L125.0 723 L129.0 716" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="12.0" y="726" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="125.0" y="756.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">7. Solicitar el código de</text><text x="125.0" y="776.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">verificación</text><path d="M125.0 796 V809.0 H875.0 V817" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M871.0 812 L875.0 819 L879.0 812" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="762.0" y="822" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="875.0" y="852.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">8. Entregar el código al</text><text x="875.0" y="872.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">correo propuesto</text><path d="M875.0 892 V905.0 H125.0 V913" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M121.0 908 L125.0 915 L129.0 908" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="12.0" y="918" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="125.0" y="948.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">9. Introducir el código y</text><text x="125.0" y="968.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">confirmar una nueva clave</text><path d="M125.0 988 V1001.0 H375.0 V1009" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M371.0 1004 L375.0 1011 L379.0 1004" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="262.0" y="1014" width="226.0" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="375.0" y="1034.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">10. Validar, vincular el</text><text x="375.0" y="1054.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">correo y guardar el</text><text x="375.0" y="1074.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">cambio</text><rect x="18" y="1120" width="964" height="116" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="1148" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="1175" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Rechazar o dejar vencer la solicitud impedirá continuar. Sin código válido o sin acceso al correo no se</text><text x="36" y="1197" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">completará el cambio. Aprobar no cambiará por sí solo la contraseña.</text></svg>