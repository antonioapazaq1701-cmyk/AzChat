<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 774" width="1000" height="774" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-06 · Recibir mensajes</title><desc id="descripcion">Flujo por participantes. Persona emisora: Enviar un mensaje a la conversación. Sistema: Guardar el mensaje para sus participantes. Persona destinataria: Abrir o mantener visible la conversación. Sistema: Entregar las novedades al consultarlas. Persona destinataria: Leer el contenido recibido. Alternativas: Si la persona está desconectada, deberá poder recuperar los mensajes al volver. Un aviso no equivale a lectura.</desc><rect x="0" y="0" width="1000" height="774" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-06 · Recibir mensajes</text><rect x="6.0" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="166.66666666666666" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona destinataria</text><line x1="0.0" y1="115" x2="0.0" y2="630" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="339.3333333333333" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="500.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="333.3333333333333" y1="115" x2="333.3333333333333" y2="630" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="672.6666666666666" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="833.3333333333333" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona emisora</text><line x1="666.6666666666666" y1="115" x2="666.6666666666666" y2="630" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="693.3333333333333" y="150" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="833.3333333333333" y="180.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Enviar un mensaje a la</text><text x="833.3333333333333" y="200.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">conversación</text><path d="M833.3333333333333 220 V233.0 H500.0 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 236 L500.0 243 L504.0 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="246" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Guardar el mensaje para sus</text><text x="500.0" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">participantes</text><path d="M500.0 316 V329.0 H166.66666666666666 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M162.66666666666666 332 L166.66666666666666 339 L170.66666666666666 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="26.666666666666657" y="342" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="372.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Abrir o mantener visible la</text><text x="166.66666666666666" y="392.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">conversación</text><path d="M166.66666666666666 412 V425.0 H500.0 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 428 L500.0 435 L504.0 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="438" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Entregar las novedades al</text><text x="500.0" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">consultarlas</text><path d="M500.0 508 V521.0 H166.66666666666666 V529" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M162.66666666666666 524 L166.66666666666666 531 L170.66666666666666 524" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="26.666666666666657" y="534" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="574.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">5. Leer el contenido recibido</text><rect x="18" y="640" width="964" height="116" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="668" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="695" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Si la persona está desconectada, deberá poder recuperar los mensajes al volver. Un aviso no equivale a</text><text x="36" y="717" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">lectura.</text></svg>