<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 678" width="1000" height="678" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-05 · Enviar mensaje</title><desc id="descripcion">Flujo por participantes. Persona emisora: Preparar el contenido y pulsar Enviar. Sistema: Comprobar sesión, pertenencia y contenido. Sistema: Guardar el mensaje y confirmar. Persona destinataria: Consultar las novedades y ver el mensaje. Alternativas: Si falla el envío, conservar el pendiente durante la sesión de página. Reintentar con el mismo identificador para evitar duplicados.</desc><rect x="0" y="0" width="1000" height="678" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-05 · Enviar mensaje</text><rect x="6.0" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="166.66666666666666" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona emisora</text><line x1="0.0" y1="115" x2="0.0" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="339.3333333333333" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="500.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="333.3333333333333" y1="115" x2="333.3333333333333" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="672.6666666666666" y="58" width="321.3333333333333" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="833.3333333333333" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona destinataria</text><line x1="666.6666666666666" y1="115" x2="666.6666666666666" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="26.666666666666657" y="150" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="166.66666666666666" y="180.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Preparar el contenido y</text><text x="166.66666666666666" y="200.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">pulsar Enviar</text><path d="M166.66666666666666 220 V233.0 H500.0 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 236 L500.0 243 L504.0 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="246" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Comprobar sesión,</text><text x="500.0" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">pertenencia y contenido</text><path d="M500.0 316 V329.0 H500.0 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M496.0 332 L500.0 339 L504.0 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="360.0" y="342" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="500.0" y="372.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Guardar el mensaje y</text><text x="500.0" y="392.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">confirmar</text><path d="M500.0 412 V425.0 H833.3333333333333 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M829.3333333333333 428 L833.3333333333333 435 L837.3333333333333 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="693.3333333333333" y="438" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="833.3333333333333" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Consultar las novedades y</text><text x="833.3333333333333" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">ver el mensaje</text><rect x="18" y="544" width="964" height="116" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="572" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="599" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Si falla el envío, conservar el pendiente durante la sesión de página. Reintentar con el mismo</text><text x="36" y="621" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">identificador para evitar duplicados.</text></svg>