<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 678" width="1000" height="678" role="img" aria-labelledby="titulo descripcion"><title id="titulo">CU-01 · Registrarse</title><desc id="descripcion">Flujo por participantes. Persona visitante: Completar los datos de registro. Sistema: Validar formato y disponibilidad. Persona visitante: Confirmar el registro. Sistema: Crear la cuenta y solicitar ingreso. Alternativas: Si los datos son inválidos o están duplicados, explicar el error y permitir corregirlos. El correo opcional deberá verificarse antes de vincularlo.</desc><rect x="0" y="0" width="1000" height="678" fill="white" /><text x="500.0" y="34" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#243b50">CU-01 · Registrarse</text><rect x="6.0" y="58" width="488.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="250.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Persona visitante</text><line x1="0.0" y1="115" x2="0.0" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="506.0" y="58" width="488.0" height="52" fill="#edf4fa" stroke="#a7b8c6" /><text x="750.0" y="90" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#243b50">Sistema</text><line x1="500.0" y1="115" x2="500.0" y2="534" stroke="#d8e2e9" stroke-dasharray="5 5" /><rect x="110.0" y="150" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="250.0" y="180.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">1. Completar los datos de</text><text x="250.0" y="200.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">registro</text><path d="M250.0 220 V233.0 H750.0 V241" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M746.0 236 L750.0 243 L754.0 236" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="610.0" y="246" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="750.0" y="276.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">2. Validar formato y</text><text x="750.0" y="296.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">disponibilidad</text><path d="M750.0 316 V329.0 H250.0 V337" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M246.0 332 L250.0 339 L254.0 332" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="110.0" y="342" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="250.0" y="382.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">3. Confirmar el registro</text><path d="M250.0 412 V425.0 H750.0 V433" fill="none" stroke="#476780" stroke-width="1.6" /><path d="M746.0 428 L750.0 435 L754.0 428" fill="none" stroke="#476780" stroke-width="1.6" /><rect x="610.0" y="438" width="280" height="70" fill="#f6f9fc" stroke="#a7b8c6" /><text x="750.0" y="468.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">4. Crear la cuenta y solicitar</text><text x="750.0" y="488.0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#243b50">ingreso</text><rect x="18" y="544" width="964" height="116" fill="#edf4fa" stroke="#a7b8c6" /><text x="36" y="572" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#243b50">Alternativas y controles</text><text x="36" y="599" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">Si los datos son inválidos o están duplicados, explicar el error y permitir corregirlos. El correo</text><text x="36" y="621" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#243b50">opcional deberá verificarse antes de vincularlo.</text></svg>