<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>06 · Perfil y recuperación de acceso</title><desc>Boceto esquemático con datos ficticios. No es una captura de la aplicación.</desc><rect width="100%" height="100%" fill="white"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="25" fill="#243244" font-weight="bold">06 · Perfil y recuperación de acceso</text><text x="28" y="64" font-family="Arial,sans-serif" font-size="16" fill="#5d6976" font-weight="normal">AzChat · Diseño revisado · Elementos simplificados y datos ficticios</text><rect x="28" y="110" width="430" height="551" rx="3" fill="#f5f7fa" stroke="#677586" stroke-width="1.6"/><text x="50" y="151" font-family="Arial,sans-serif" font-size="23" fill="#243244" font-weight="bold">Perfil del estudiante</text><rect x="169" y="183" width="144" height="144" rx="3" fill="white" stroke="#9ba7b3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="196" y="261" font-family="Arial,sans-serif" font-size="21" fill="#243244" font-weight="normal">Foto 1:1</text><text x="50" y="368" font-family="Arial,sans-serif" font-size="16" fill="#243244" font-weight="normal">Nombre visible</text><rect x="50" y="378" width="386" height="42" rx="3" fill="white" stroke="#9ba7b3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="50" y="460" font-family="Arial,sans-serif" font-size="16" fill="#243244" font-weight="normal">Descripción</text><rect x="50" y="470" width="386" height="42" rx="3" fill="white" stroke="#9ba7b3" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="50" y="570" width="180" height="38" rx="3" fill="#e3edf9" stroke="#4e739d" stroke-width="1.6"/><text x="62" y="595" font-family="Arial,sans-serif" font-size="16" fill="#243244" font-weight="normal">Guardar perfil</text><rect x="492" y="110" width="680" height="551" rx="3" fill="white" stroke="#677586" stroke-width="1.6"/><text x="520" y="151" font-family="Arial,sans-serif" font-size="23" fill="#243244" font-weight="bold">Recuperar cuenta</text><rect x="520" y="207" width="622" height="68" rx="3" fill="#f5f7fa" stroke="#9ba7b3" stroke-width="1.6"/><text x="539" y="247" font-family="Arial,sans-serif" font-size="21" fill="#243244" font-weight="normal">1   Indicar cuenta y correo</text><rect x="520" y="310" width="622" height="68" rx="3" fill="#f5f7fa" stroke="#9ba7b3" stroke-width="1.6"/><text x="539" y="350" font-family="Arial,sans-serif" font-size="21" fill="#243244" font-weight="normal">2   Verificar código recibido</text><rect x="520" y="413" width="622" height="68" rx="3" fill="#f5f7fa" stroke="#9ba7b3" stroke-width="1.6"/><text x="539" y="453" font-family="Arial,sans-serif" font-size="21" fill="#243244" font-weight="normal">3   Confirmar nueva contraseña</text><text x="520" y="548" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Correo nuevo: revisión del responsable antes del código.</text><text x="520" y="587" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">Gmail envía el correo; AzChat valida y restablece.</text><text x="28" y="708" font-family="Arial,sans-serif" font-size="18" fill="#243244" font-weight="normal">La vista del perfil y el formulario de recuperación son recorridos independientes.</text></svg>