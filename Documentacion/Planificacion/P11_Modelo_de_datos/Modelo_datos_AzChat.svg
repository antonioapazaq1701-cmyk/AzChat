<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Datos del intercambio entre estudiantes</title><desc id="desc">PK: clave primaria. FK: referencia a otra tabla. UQ: combinación única.</desc>
