<text x="337.5" y="521.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">0..1</text>
<rect x="30" y="110" width="290" height="175" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M30,153 H320" stroke="#b9ccd9"/>
<text x="45" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">usuarios</text>
<text x="45" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id; UQ usuario y código.</text>
<text x="45" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">hash_contrasena, perfil.</text>
<text x="45" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">ajustes, correo confirmado.</text>
<text x="45" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">foto_id → archivos.</text>
<rect x="355" y="110" width="290" height="175" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M355,153 H645" stroke="#b9ccd9"/>
<text x="370" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">miembros</text>
<text x="370" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK (conversación, usuario).</text>
<text x="370" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">FK a ambas tablas.</text>
<text x="370" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">rol, ultimo_leido.</text>
<text x="370" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">fijado, silenciado.</text>
<rect x="680" y="110" width="290" height="175" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M680,153 H970" stroke="#b9ccd9"/>
<text x="695" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">conversaciones</text>
<text x="695" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id; tipo y creador.</text>
<text x="695" y="205" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">pareja UQ para privados.</text>
<text x="695" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">nombre, descripción y foto.</text>
<text x="695" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">FK creador → usuarios.</text>
<rect x="680" y="430" width="290" height="200" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M680,473 H970" stroke="#b9ccd9"/>
<text x="695" y="459" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">mensajes</text>
<text x="695" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id; FK chat y emisor.</text>
<text x="695" y="525" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">UQ (emisor_id, id_envio).</text>
<text x="695" y="550" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">texto y respuesta_id.</text>
<text x="695" y="575" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">editado, eliminado y fechas.</text>
<text x="695" y="600" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">respuesta_id → mensajes.</text>
<rect x="355" y="430" width="290" height="200" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M355,473 H645" stroke="#b9ccd9"/>
<text x="370" y="459" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">mensaje_archivos</text>
<text x="370" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK (mensaje, archivo).</text>
<text x="370" y="525" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">FK a ambas tablas.</text>
<text x="370" y="550" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">archivo_id también es UQ.</text>
<text x="370" y="575" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Un archivo se vincula</text>
<text x="370" y="600" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">a un único mensaje.</text>
<rect x="30" y="430" width="290" height="200" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M30,473 H320" stroke="#b9ccd9"/>
<text x="45" y="459" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">archivos</text>
<text x="45" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id UUID; FK propietario.</text>
<text x="45" y="525" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">FK conversación opcional.</text>
<text x="45" y="550" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">contenido bytea y tamaño.</text>
<text x="45" y="575" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">mime, nombre y clase.</text>
<text x="45" y="600" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Foto o adjunto.</text>
<text x="30" y="722" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Relaciones principales de 6 tablas. El diccionario detalla autoría, fotos y respuestas a otros mensajes.</text>
<text x="30" y="745" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Las 5 tablas de acceso, preferencias privadas y recuperación se muestran en la figura siguiente.</text>
</svg>
