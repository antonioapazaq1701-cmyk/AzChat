<text x="240.0" y="548.5" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">Sesión hash</text>
<path d="M445,717.5 L555,717.5" stroke="#375d7b" stroke-width="2" fill="none"/>
<path d="M555,717.5 L545.0,713.5 L545.0,721.5 Z" fill="#375d7b"/>
