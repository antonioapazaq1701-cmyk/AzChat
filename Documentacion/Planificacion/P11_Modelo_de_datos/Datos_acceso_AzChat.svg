<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="title desc">
<title id="title">Datos de acceso y recuperación</title><desc id="desc">Cinco tablas de apoyo completan las once tablas del diseño.</desc>
