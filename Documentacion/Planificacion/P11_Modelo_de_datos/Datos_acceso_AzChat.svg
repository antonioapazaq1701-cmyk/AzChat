<text x="500.0" y="708.5" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#243b50" text-anchor="middle">1 a N</text>
<rect x="280" y="110" width="440" height="100" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,153 H720" stroke="#b9ccd9"/>
<text x="295" y="139" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">usuarios · referencia del núcleo</text>
<text x="295" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">La cuenta del estudiante es la referencia.</text>
<rect x="35" y="325" width="410" height="170" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,368 H445" stroke="#b9ccd9"/>
<text x="50" y="354" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">sesiones</text>
<text x="50" y="395" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK sid; sess JSON y expire.</text>
<text x="50" y="420" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">usuarioId y venceEn dentro de sess.</text>
<text x="50" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Referencia lógica a usuarios.</text>
<text x="50" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">No hay FK para ese campo JSON.</text>
<rect x="555" y="325" width="410" height="170" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,368 H965" stroke="#b9ccd9"/>
<text x="570" y="354" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">notificaciones_push</text>
<text x="570" y="395" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id; FK usuario_id.</text>
<text x="570" y="420" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">UQ endpoint; claves y sesion_id.</text>
<text x="570" y="445" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Sesión vigente para entregar avisos.</text>
<text x="570" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">sesion_id: referencia lógica, sin FK.</text>
<rect x="35" y="620" width="410" height="195" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M35,663 H445" stroke="#b9ccd9"/>
<text x="50" y="649" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">solicitudes_recuperacion</text>
<text x="50" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id UUID; FK usuario opcional.</text>
<text x="50" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">sesion_hash y correo propuesto.</text>
<text x="50" y="740" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">estado, vencimiento y decisión.</text>
<text x="50" y="765" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">version_clave y token_admin_hash.</text>
<rect x="555" y="620" width="410" height="195" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M555,663 H965" stroke="#b9ccd9"/>
<text x="570" y="649" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">correo_desafios</text>
<text x="570" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK id UUID; FK usuario opcional.</text>
<text x="570" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">FK solicitud_id opcional.</text>
<text x="570" y="740" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">código HMAC, propósito e intentos.</text>
<text x="570" y="765" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">envío, vencimiento y consumo.</text>
<rect x="280" y="930" width="440" height="120" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M280,973 H720" stroke="#b9ccd9"/>
<text x="295" y="959" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">contactos_privados</text>
<text x="295" y="1000" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">PK (usuario_id, contacto_id).</text>
<text x="295" y="1025" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Dos FK a usuarios; nombre por propietario.</text>
<text x="30" y="1092" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Las líneas discontinuas indican vínculos lógicos. Las demás FK se detallan en el diccionario de P11.</text>
</svg>
