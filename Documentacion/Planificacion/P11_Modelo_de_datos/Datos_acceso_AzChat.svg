<rect width="1000" height="1130" fill="white"/>
<text x="30" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#243b50" text-anchor="start">Datos de acceso y recuperación</text>
<text x="30" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Cinco tablas de apoyo completan las once tablas del diseño.</text>
<path d="M500.0,210 L240.0,325" stroke="#375d7b" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
