<text x="55" y="149" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Estudiante / Usuario</text>
<text x="55" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Identidad y perfil.</text>
<text x="55" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Preferencias de su cuenta.</text>
<rect x="370" y="120" width="260" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M370,163 H630" stroke="#b9ccd9"/>
<text x="385" y="149" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Pertenencia</text>
<text x="385" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Vincula usuario y chat.</text>
<text x="385" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Rol y última lectura.</text>
<rect x="680" y="120" width="280" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M680,163 H960" stroke="#b9ccd9"/>
<text x="695" y="149" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Conversación</text>
<text x="695" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Privada o de grupo.</text>
<text x="695" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Espacio de intercambio.</text>
<rect x="680" y="380" width="280" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M680,423 H960" stroke="#b9ccd9"/>
<text x="695" y="409" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Mensaje</text>
<text x="695" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Autor y contenido.</text>
<text x="695" y="475" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Puede responder a otro.</text>
<rect x="370" y="380" width="260" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M370,423 H630" stroke="#b9ccd9"/>
<text x="385" y="409" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Archivo</text>
<text x="385" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Adjunto o foto.</text>
<text x="385" y="475" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Contenido y metadatos.</text>
<rect x="40" y="380" width="280" height="140" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M40,423 H320" stroke="#b9ccd9"/>
<text x="55" y="409" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Nombre privado</text>
<text x="55" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Propietario y contacto.</text>
<text x="55" y="475" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Nombre visible solo al dueño.</text>
<rect x="40" y="630" width="400" height="120" fill="#f5f9fc" stroke="#6a8ba6" stroke-width="1.5"/>
<path d="M40,673 H440" stroke="#b9ccd9"/>
<text x="55" y="659" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243b50" text-anchor="start">Recuperación</text>
<text x="55" y="700" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Solicitud y verificación de correo.</text>
<text x="55" y="725" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#243b50" text-anchor="start">Control del cambio de contraseña.</text>
<text x="30" y="802" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#243b50" text-anchor="start">Las relaciones y claves de almacenamiento se concretan en P11; este modelo explica el dominio.</text>
